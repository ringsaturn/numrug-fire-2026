[project]
name = "numrug-fire-2026"
version = "0.1.0"
description = "Scripts that rebuild the figures of the October 2026 Arxan grassland fire write-up from public data"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Pinned to the versions the published figures were drawn with; a different
# matplotlib or font build shifts text by a pixel or two.
dependencies = [
  "matplotlib==3.11.2",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pandas==3.0.6",
  "pillow==13.0.0",
  "pyproj==3.8.0",
  "shapely==2.2.0",
  "pyshp==3.1.6",
  "rasterio==1.5.2",
  "xarray==2026.9.0",
  "zarr==3.4.1",
  "netcdf4==1.7.5",
  "h5py==3.16.0",
  "h5netcdf==1.8.1",
  "pyhdf==0.11.7",
  "pyresample==1.35.0",
  "satpy==0.60.0",
  "s3fs==2026.9.0",
  "requests==2.34.2",
  "pystac-client==0.9.0",
  "planetary-computer==1.0.0",
]

[project.scripts]
numrug-figs = "figkit.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["figkit"]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 120
extend-exclude = ["data", "out"]
