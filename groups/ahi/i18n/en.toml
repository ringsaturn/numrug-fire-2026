bt7_max_axis = "Max BT7 (K)"
footer = "Data: Himawari-9 AHI L1b full disk B07/B14 (JMA/NOAA, AWS noaa-himawari9), 10-08 02:00–10-13 22:00 UTC+8 (10-07 18:00–10-13 14:00 UTC); VIIRS active fire (NASA). Grey shading = night (solar zenith angle ≥ 85°).\nDetection: BT7>320 K (day)/310 K (night) or BT7−BT14 >4σ above the 21×21 background mean and >10 K; BT14 cloud screen."
