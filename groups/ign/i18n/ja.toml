# 日本語。時刻は特記なければ UTC+8。

[fonts]
# Latin and digits in Arial, so tick labels have the same metrics as the English version; kana and kanji from Hiragino
family = ["Arial", "Hiragino Sans", "Noto Sans CJK JP", "DejaVu Sans"]

["ignition-gk2a-20261008-ir"]
