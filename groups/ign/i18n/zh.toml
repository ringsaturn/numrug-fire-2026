# The published zh figures of this group were drawn in PingFang SC; its narrower
# digits keep the 119.25…119.60 ticks apart.
[fonts]
files = ["/System/Library/AssetsV2/com_apple_MobileAsset_Font*/*/AssetData/PingFang.ttc"]
family = ["PingFang SC", "Noto Sans CJK SC", "Hiragino Sans GB", "DejaVu Sans"]

