footer = """黄色実線：国境（OSM）、LSIB／河川中心線による；水色破線：国境（Natural Earth）、10m、OSM の線との差 0.5〜2 km。白い四角：アルシャン市街。黒い三角形の部分（{d1}・{d3} は左上、{d2} は右下）は軌道の観測幅の外でデータなし。
短波赤外画像では、明るい赤／橙＝燃焼中の延焼前線、黒褐色／暗い赤褐色＝焼失域、青紫＝煙、水色〜白＝雲。データ：Copernicus Sentinel-2、Element84 Earth Search COG。"""

[s2-fronts-20261010]
