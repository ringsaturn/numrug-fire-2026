title = "国境チェック A：47.20〜47.38°N、119.40〜119.65°E（{a_md} {a_lt}〜{b_md} {b_lt}（UTC+8、{a_md} {a_utc}〜{b_md} {b_utc} UTC）に低 FRP の火点が続く）"
footer = """黄色実線：国境（OSM）、LSIB／河川中心線；水色破線：国境（Natural Earth）、10m。データ：Copernicus Sentinel-2 L2A（Element84 Earth Search COG）。
丸は対応期間の VIIRS/MODIS 火点（NASA）（画素中心、VIIRS 375 m／MODIS 1 km、位置誤差 約 ±0.2〜0.5 km）。
雲のない最後の Sentinel-2 画像は {md} {lt}（UTC+8、{utc} UTC）で、これらの火点より前のため、出火前／延焼前線の到達前の地表と既存の防火帯しか写っていない。"""

