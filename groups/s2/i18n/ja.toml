se = "南東の延焼前線"
nw = "北西の火頭"
title = "Sentinel-2B 10 m フル解像度：{md} {lt}（UTC+8）の活動中の延焼前線"
footer = """黄色実線：国境（OSM）、LSIB／河川中心線；水色破線：国境（Natural Earth）、10m。データ：Copernicus Sentinel-2 L2A（Element84 Earth Search COG）。
明るい赤／橙黄＝燃焼中（B12 飽和）、青紫＝煙、黒褐色＝焼失域。丸は 25 分後の NOAA-21 VIIRS 火点（NASA）。"""

[border-a]
panel = "{label}\n{sat} {time}\n{band}{sep}{res} m"
pre = "A 区域（アルシャン口岸付近） 出火前"
