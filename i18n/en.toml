bag = "Нөмрөг баг (Nömrög bag)"
sum = "Халхгол (Khalkhgol sum centre)"
ford = "ford"
track_end = "end of OSM track"
khalkh = "Халх гол (Khalkh River)"
delger = "Дэлгэр гол (Delger River)"
ignition = "ignition point"
roads = "roads, Mongolian side (OSM)"
