# Shared English strings and formats. Figure strings are in groups/<group>/i18n/en.toml.
# English is the fallback for every other language.

[fonts]
# The CJK fallback only draws glyphs DejaVu lacks (Chinese place names such as 阿尔山口岸).
files = ["/System/Library/Fonts/Hiragino Sans GB.ttc"]
family = ["DejaVu Sans", "Hiragino Sans GB", "Noto Sans CJK SC"]

[fmt]
md = "{m:02d}-{d:02d}"
hm = "{H:02d}:{M:02d}"
mdhm = "{m:02d}-{d:02d} {H:02d}:{M:02d}"
ymd = "{Y}-{m:02d}-{d:02d}"
thousands = ","
decimal = "."

[common]
utc8 = "UTC+8"
local_time_axis = "Local time (UTC+8)"

# OSM snapshot 2026-10-25 (figkit/osm.py): place labels keep the original name and add the English one.
[osm]
sumber = "Сүмбэр боомт (Sümber port)"
arxan_port = "阿尔山口岸 (Arxan port)"
